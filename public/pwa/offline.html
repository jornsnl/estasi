<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Geen verbinding · Estasi Beheer</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      background: #faf8f3; color: #2a2624; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    main { max-width: 22rem; text-align: center; background: #fff; border: 1px solid #e8e2d4; border-radius: 16px; padding: 32px 24px; }
    h1 { font: 500 30px/1.2 "Cormorant Garamond", Georgia, serif; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: #6b6560; font-size: 15px; }
    button { appearance: none; border: 0; border-radius: 10px; background: #722f37; color: #fff; font: inherit; font-weight: 500; padding: 12px 20px; width: 100%; }
  </style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#722F37"/><rect x="5" y="5" width="54" height="54" rx="10" fill="none" stroke="#C9B677" stroke-width="1.5" opacity="0.7"/><text x="32" y="45.5" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="600" fill="#E8D9A8">E</text></svg>
    <h1>Geen verbinding</h1>
    <p>Het beheer heeft internet nodig. Controleer je wifi of mobiele data en probeer het opnieuw.</p>
    <button type="button" onclick="location.reload()">Opnieuw proberen</button>
  </main>
</body>
</html>
