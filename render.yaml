# Render blueprint. Railway needs no config file: it picks up the Dockerfile.
services:
  - type: web
    name: wedding-plan-academy
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: DATA_BACKEND
        value: supabase
      - key: APP_URL
        sync: false
      - key: CONTACT_EMAIL
        value: academy@estasiweddings.nl
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
