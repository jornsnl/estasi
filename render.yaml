# Render blueprint. Railway needs no config file: it picks up the Dockerfile.
services:
  - type: web
    name: wedding-plan-academy
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /login
    # Deploy on every push to main.
    autoDeployTrigger: commit
    # Runs in the new image before it goes live; a failed migration stops the deploy.
    preDeployCommand: node scripts/migrate.mjs
    envVars:
      - key: APP_URL
        sync: false
      - key: CONTACT_EMAIL
        value: academy@estasiweddings.nl
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Supabase "Session pooler" connection string: all app data (Academy and Your Wedding Space) and the migrations.
      - key: DATABASE_URL
        sync: false
      # E-mail for Your Wedding Space via Resend (preferred): API key with
      # sending access; the domain of MAIL_FROM must be verified at Resend.
      - key: RESEND_API_KEY
        sync: false
      # Or any SMTP server instead (leave empty when Resend is used).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "Sabine van Estasi Weddings <sabine@estasiweddings.nl>"
      - key: ADMIN_NOTIFY_EMAIL
        value: sabine@estasiweddings.nl
      # Optional: AI summaries in Your Wedding Space.
      - key: ANTHROPIC_API_KEY
        sync: false
