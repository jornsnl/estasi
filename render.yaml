# Render blueprint. Railway needs no config file: it picks up the Dockerfile.
services:
  - type: web
    name: wedding-plan-academy
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /login
    # Deploy on every push to main.
    autoDeployTrigger: commit
    # Runs in the new image before it goes live; a failed migration stops the deploy.
    preDeployCommand: node scripts/migrate.mjs
    # Your Wedding Space lives in wedding-space/ and deploys on its own.
    buildFilter:
      ignoredPaths:
        - wedding-space/**
    envVars:
      - key: DATA_BACKEND
        value: supabase
      - key: APP_URL
        sync: false
      - key: CONTACT_EMAIL
        value: academy@estasiweddings.nl
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Supabase "Session pooler" connection string, only used by the migrations.
      - key: DATABASE_URL
        sync: false

  # Your Wedding Space: the portal per couple, its own app and database.
  - type: web
    name: your-wedding-space
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: wedding-space
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeployTrigger: commit
    preDeployCommand: node scripts/migrate.mjs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "Sabine van Estasi Weddings <sabine@estasiweddings.nl>"
      - key: ADMIN_NOTIFY_EMAIL
        value: sabine@estasiweddings.nl
